upstream rebuilt_backend { server backend:8080; }
server {
    listen 80;
    server_name localhost;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    root /usr/share/nginx/html;
    client_max_body_size 1024m;
    location /files/ { proxy_pass http://rebuilt_backend; proxy_set_header Host $host; }
    location = /api/model/3DModel/translate/status/callback {
        access_log off;
        proxy_pass http://rebuilt_backend;
        proxy_set_header Host $host;
    }
    location /api/ { proxy_pass http://rebuilt_backend; proxy_set_header Host $host; }
    location /actuator/health { proxy_pass http://rebuilt_backend; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
}
server {
    listen 81;
    client_max_body_size 1024m;
    server_name localhost;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    location = /api/model/3DModel/translate/status/callback {
        access_log off;
        proxy_pass http://rebuilt_backend;
        proxy_set_header Host $host;
    }
    location / { proxy_pass http://rebuilt_backend; proxy_set_header Host $host; }
    add_header X-Content-Type-Options nosniff always;
}
